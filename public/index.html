<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Music</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <div class="background"></div>

  <main class="app">

    <div id="clock">00:00</div>

    <div id="youtube-player"></div>

    <div class="hero-spacer" aria-hidden="true"></div>

    <section class="player">

      <div class="track">
        <span id="title">Nothing Playing</span>
        <span id="artist">—</span>
      </div>

      <div class="timeline">
        <span id="current-time">0:00</span>

        <input
          id="progress"
          type="range"
          min="0"
          max="100"
          value="0"
        >

        <span id="duration">0:00</span>
      </div>

      <div class="controls">
        <div class="transport-controls">
          <button id="previous" class="control-button" type="button" aria-label="Previous track">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h2v14H5V5Zm13 1-8 6 8 6V6Z" /></svg>
          </button>

          <button id="play" class="play" type="button" aria-label="Play">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 9 6-9 6V6Z" /></svg>
          </button>

          <button id="next" class="control-button" type="button" aria-label="Next track">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5h2v14h-2V5ZM6 6l8 6-8 6V6Z" /></svg>
          </button>
        </div>

        <button
          id="repeat"
          class="repeat"
          type="button"
          aria-label="Repeat off"
          aria-pressed="false"
          title="Repeat off"
        ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8.5V5l3 3.5-3 3.5V9.5c-1.1-1.2-2.7-2-4.5-2a6.5 6.5 0 1 0 6.2 8.5" /></svg></button>
      </div>

    </section>

    <aside class="playlist-panel" aria-labelledby="playlist-heading">
      <div class="playlist-heading">
        <span id="playlist-heading">Playlist</span>
        <span id="playlist-count"></span>
      </div>
      <div class="playlist-filters" role="tablist" aria-label="Playlist categories">
        <button class="playlist-filter is-active" type="button" role="tab" aria-selected="true" data-category="all">All</button>
        <button class="playlist-filter" type="button" role="tab" aria-selected="false" data-category="south">South</button>
        <button class="playlist-filter" type="button" role="tab" aria-selected="false" data-category="punjabi">Punjabi</button>
        <button class="playlist-filter" type="button" role="tab" aria-selected="false" data-category="phonk">Phonk</button>
        <button class="playlist-filter" type="button" role="tab" aria-selected="false" data-category="hindi">Hindi</button>
        <button class="playlist-filter" type="button" role="tab" aria-selected="false" data-category="english">English</button>
        <button class="playlist-filter" type="button" role="tab" aria-selected="false" data-category="edit">Edit</button>
      </div>
      <div id="playlist" class="playlist-items" aria-label="Song list"></div>
    </aside>

  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script type="module" src="/js/player.js"></script>
</body>
</html>
